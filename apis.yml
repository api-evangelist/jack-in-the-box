description: >-
  Jack in the Box Inc. (NASDAQ: JACK), founded in 1951 and headquartered in
  San Diego, California, is a quick-service restaurant company operating and
  franchising approximately 2,200 Jack in the Box hamburger restaurants across
  21 U.S. states. In December 2021 the company acquired Del Taco for $575M;
  in August 2025 it announced a strategic review of Del Taco and on October
  2025 agreed to divest Del Taco (~600 locations) to Yadav Enterprises for
  $115M, with the transaction closing December 22, 2025. Digital channels
  include the Jack in the Box mobile app, Jack Pack loyalty program, online
  ordering, and integrations with third-party delivery platforms (DoorDash,
  Grubhub, Uber Eats). The company does not publish a public developer API;
  all digital ordering, loyalty, and franchise systems are operated via
  internal platforms and partner integrations.
